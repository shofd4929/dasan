plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'war'
}

group = 'kr.go'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'  // 'libs' 디렉토리에서 JAR 파일을 찾기
    }
}

dependencies {
    implementation group: 'com.jcraft', name: 'jsch', version: '0.1.55'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    // Lombok 의존성
    compileOnly 'org.projectlombok:lombok:1.18.22' // Lombok 버전
    annotationProcessor 'org.projectlombok:lombok:1.18.22'
    // Lombok을 테스트 코드에서도 사용하려면 testAnnotationProcessor 추가
    testCompileOnly 'org.projectlombok:lombok:1.18.22' // 테스트용 Lombok
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.22' // 테스트용 annotationProcessor
    // h2 드라이버
    runtimeOnly 'com.h2database:h2:2.3.232'
    // mariadb 드라이버
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Oracle DB 드라이버
    implementation 'com.oracle.database.jdbc:ojdbc8:19.8.0.0'
    implementation 'com.oracle.ojdbc:orai18n:19.3.0.0'
    // Google OTP 라이브러리
    implementation 'com.warrenstrange:googleauth:1.3.0'
    // 테스트 관련 의존성
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.oracle.database.jdbc:ojdbc8:19.8.0.0'
    // mybatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    // p6spy
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'
    // hibernate
    implementation 'org.hibernate:hibernate-validator:8.0.2.Final'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    // jasypt
    implementation group: 'com.github.ulisesbocchio', name: 'jasypt-spring-boot-starter', version: '3.0.5'
    implementation 'org.springframework.boot:spring-boot-starter-web'  // JAR와 WAR 모두에 포함될 의존성
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'  // WAR 배포 시 Tomcat 제공
    // security
    //implementation 'org.springframework.boot:spring-boot-starter-security'
    //testImplementation 'org.springframework.security:spring-security-test'

}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/DatabaseTest*'  // DB와 관련된 테스트를 제외
    //enabled = false  // 또는 필요한 경우 테스트를 실행하지 않도록 설정
}


bootJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE  // 중복 항목을 병합
    archiveBaseName = 'my-application-jar' // WAR 파일의 이름 설정
    version = '0.0.1'
    mainClass = 'kr.go.ebankingBatch.SpringBatchApplication'
}

bootWar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE  // 중복 항목 제외
    archiveBaseName = 'my-application-war' // WAR 파일의 이름 설정
    version = '0.0.1'
    mainClass = 'kr.go.ebankingBatch.SpringBatchApplication'
}

war {
    enabled = true  // WAR 파일 생성 허용
}

// build 태스크에 bootJar와 bootWar 동시생성
build.dependsOn bootJar, bootWar